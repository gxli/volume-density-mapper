[project]
name = "volume-density-mapper"
version = "0.2.0.dev0"
description = "Reconstructs 3D density distributions from 2D column density maps using constrained diffusion."
readme = "README.rst"
authors = [
    { name = "Guang-Xing Li", email = "ligx.ngc7293@gmail.com" }
]
license = "GPL-3.0-or-later"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "constrained-diffusion>=1.2.0"
]

[project.optional-dependencies]
gpu = [
    "constrained-diffusion[gpu]>=1.2.5",
    "cupy-cuda12x>=12.0; platform_system == 'Linux'"
]
test = [
    "pytest>=7",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["volume_density_mapper*"]

[tool.setuptools.package-data]
volume_density_mapper = ["*.py"]

[project.urls]
Homepage = "https://github.com/gxli/volume-density-mapper"
